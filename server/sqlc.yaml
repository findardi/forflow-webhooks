version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/store/queries
    gen:
      go:
        package: sqlc
        out: db/store/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_json_tags: true
        json_tags_case_style: snake
        overrides:
          - column: "messages.payload"
            go_type: "encoding/json.RawMessage"
